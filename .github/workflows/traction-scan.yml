name: Traction Scan

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: traction-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scanner
        run: python traction_scan.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        run: |
          git config user.name "scan-bot"
          git config user.email "actions@github.com"
          git add traction_state.json traction_trades.csv
          git diff --staged --quiet || git commit -m "update scan state"
          git pull --no-rebase -X ours origin main
          git push
